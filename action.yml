# Denpex GitHub Action
#
# Two jobs, one action:
#
#   * DIAGNOSE a failed training run. Add it with `if: failure()` and it reads the
#     crash log, tells you the root cause and the fix, and prints them in the
#     Actions console. The first no-key diagnosis is frictionless; CI needs an
#     API key after that because it cannot complete a browser challenge.
#
#   * GATE a pipeline before launch. `preflight`, `preflight-deep`,
#     `check-versions` and `validate-checkpoint` all exit non-zero on a blocker,
#     which fails the job.
#
# Both run the SAME single-file agent you install on a training node
# (curl -O https://denpex.com/agent/denpex.py). There is no separate package to
# install and nothing to configure beyond the inputs below.
#
# ── Why `check` defaults to `auto` ───────────────────────────────────────────
# This action shipped with a README describing diagnosis and an action.yml that
# only ever ran preflight. `logs-file` and `api-key` were not even declared, so
# anyone following the quickstart passed inputs the action ignored and got a
# preflight check after their job had already failed. `auto` repairs that without
# breaking anyone: it diagnoses when there is a log to diagnose, and falls back to
# preflight when there is not, which is what the old default did.
name: 'Denpex - diagnose ML training failures'
description: 'Diagnose a failed training run, or gate a pipeline with a pre-launch check. Root cause and fix, printed in the Actions console.'
author: 'Denpex'

branding:
  icon: 'activity'
  color: 'purple'

inputs:
  check:
    description: >-
      auto (default) | diagnose | preflight | preflight-deep | check-versions | validate-checkpoint.
      `auto` diagnoses when `logs-file` exists and holds a log, otherwise runs preflight.
      `diagnose` reads a crash log and prints the root cause and fix.
      `preflight-deep` adds the NCCL topology lint (GPU-to-NIC affinity, PCIe ACS, NCCL env vs the
      real fabric, memlock) and needs a runner that can see the GPUs.
    required: false
    default: 'auto'
  api-key:
    description: >-
      Your Denpex API key. Optional for one frictionless no-key diagnosis. Later anonymous
      diagnoses require a browser check that CI cannot complete. With a key, the diagnosis is
      attributed to your account and alerts route to your configured Slack/PagerDuty/webhook channels.
    required: false
    default: ''
  logs-file:
    description: >-
      Path (relative to working-directory) of the training log to diagnose. If it is missing or
      empty, common fallbacks are tried: training.log, train.log, nohup.out.
    required: false
    default: 'training.log'
  fail-on-diagnosis:
    description: >-
      Whether a successful diagnosis should fail the step. Default false: the job that produced
      the log has already failed, and failing again hides the diagnosis behind a red step.
    required: false
    default: 'false'
  checkpoint-dir:
    description: 'Checkpoint directory. Passed to preflight (--checkpoint-dir) as an optional extra check, and REQUIRED (as the positional path) for validate-checkpoint.'
    required: false
    default: ''
  agent-url:
    description: 'URL of the single-file Denpex agent to download. Override only for air-gapped/self-hosted mirrors.'
    required: false
    default: 'https://denpex.com/agent/denpex.py'
  verify-checksum:
    description: >-
      Verify the downloaded agent against the published SHA256SUMS before running it. Default true.
      Set false only for a mirror that does not publish a manifest - you are then executing
      unverified code on your runner.
    required: false
    default: 'true'
  python-version:
    description: 'Python version to set up for the check (agent needs Python 3.8+).'
    required: false
    default: '3.x'
  working-directory:
    description: 'Directory the check runs in, so relative log and checkpoint paths resolve against it.'
    required: false
    default: '.'

outputs:
  diagnosed:
    description: 'true when a log was found and diagnosed; false when the run was a preflight gate or no log was found.'
    value: ${{ steps.denpex.outputs.diagnosed }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Download and verify the Denpex agent
      shell: bash
      env:
        AGENT_URL: ${{ inputs.agent-url }}
        VERIFY: ${{ inputs.verify-checksum }}
      run: |
        set -euo pipefail
        AGENT_DIR="${RUNNER_TEMP:-/tmp}"
        AGENT_PATH="${AGENT_DIR}/denpex.py"
        echo "Downloading the single-file Denpex agent from ${AGENT_URL}"
        curl -fsSL -o "${AGENT_PATH}" "${AGENT_URL}"

        # Verify before executing. denpex.com publishes SHA256SUMS beside the
        # agent; running unverified code fetched over the network on a runner
        # that holds your secrets is a supply-chain risk worth one curl.
        if [ "${VERIFY}" = "true" ]; then
          SUMS_URL="${AGENT_URL%/*}/SHA256SUMS"
          if curl -fsSL -o "${AGENT_DIR}/SHA256SUMS" "${SUMS_URL}"; then
            ( cd "${AGENT_DIR}" && grep ' \*\?denpex\.py$' SHA256SUMS > denpex.py.sha256 \
              && sha256sum -c denpex.py.sha256 )
            echo "Agent checksum verified against ${SUMS_URL}"
          else
            echo "::error::Could not fetch ${SUMS_URL} to verify the agent. Refusing to execute unverified code. Set verify-checksum: false to override."
            exit 1
          fi
        else
          echo "::warning::verify-checksum is false - running an unverified agent."
        fi
        echo "DENPEX_AGENT_PATH=${AGENT_PATH}" >> "${GITHUB_ENV}"

    - name: Run Denpex
      id: denpex
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHECK: ${{ inputs.check }}
        CKPT_DIR: ${{ inputs.checkpoint-dir }}
        LOGS_FILE: ${{ inputs.logs-file }}
        FAIL_ON_DIAGNOSIS: ${{ inputs.fail-on-diagnosis }}
        DENPEX_API_KEY: ${{ inputs.api-key }}
      run: |
        set -uo pipefail
        AGENT_PATH="${DENPEX_AGENT_PATH}"
        echo "diagnosed=false" >> "${GITHUB_OUTPUT}"

        # Ignore only files below the six-byte hard floor. The API quality gate
        # decides whether the admitted text has diagnostic signal.
        find_log() {
          for candidate in "${LOGS_FILE}" training.log train.log nohup.out; do
            [ -n "${candidate}" ] || continue
            if [ -f "${candidate}" ] && [ "$(wc -c < "${candidate}")" -ge 6 ]; then
              printf '%s' "${candidate}"
              return 0
            fi
          done
          return 1
        }

        run_diagnose() {
          log="$1"
          echo "Diagnosing ${log} ($(wc -c < "${log}") bytes)"
          if [ -z "${DENPEX_API_KEY}" ]; then
            echo "No api-key set - the first no-key diagnosis is frictionless; later runs need a Denpex API key."
          fi
          python "${AGENT_PATH}" diagnose "${log}"
          rc=$?
          echo "diagnosed=true" >> "${GITHUB_OUTPUT}"
          if [ "${FAIL_ON_DIAGNOSIS}" = "true" ]; then
            return "${rc}"
          fi
          # The job that produced this log has already failed. Failing again
          # collapses the diagnosis into a red step nobody expands.
          return 0
        }

        RESOLVED="${CHECK}"
        if [ "${RESOLVED}" = "auto" ]; then
          if find_log >/dev/null; then
            RESOLVED="diagnose"
          else
            RESOLVED="preflight"
            echo "No training log found (looked for: ${LOGS_FILE}, training.log, train.log, nohup.out) - running preflight instead."
          fi
        fi

        case "${RESOLVED}" in
          diagnose)
            if ! LOG_PATH="$(find_log)"; then
              echo "::error::check is 'diagnose' but no log was found. Looked for: ${LOGS_FILE}, training.log, train.log, nohup.out. Set logs-file to the path your job writes."
              exit 1
            fi
            run_diagnose "${LOG_PATH}"
            ;;
          preflight)
            set -e
            if [ -n "${CKPT_DIR}" ]; then
              python "${AGENT_PATH}" preflight --checkpoint-dir "${CKPT_DIR}"
            else
              python "${AGENT_PATH}" preflight
            fi
            ;;
          preflight-deep)
            # Deep NCCL topology lint on top of the standard preflight: GPU-to-NIC
            # affinity, PCIe ACS, NCCL env validated against the runner's real
            # fabric, memlock limits. Needs a runner that can see the GPUs.
            set -e
            if [ -n "${CKPT_DIR}" ]; then
              python "${AGENT_PATH}" preflight --deep --checkpoint-dir "${CKPT_DIR}"
            else
              python "${AGENT_PATH}" preflight --deep
            fi
            ;;
          check-versions)
            set -e
            python "${AGENT_PATH}" check-versions
            ;;
          validate-checkpoint)
            set -e
            if [ -z "${CKPT_DIR}" ]; then
              echo "::error::validate-checkpoint requires the 'checkpoint-dir' input"
              exit 1
            fi
            python "${AGENT_PATH}" validate-checkpoint "${CKPT_DIR}"
            ;;
          *)
            echo "::error::unknown check '${CHECK}' (expected: auto | diagnose | preflight | preflight-deep | check-versions | validate-checkpoint)"
            exit 1
            ;;
        esac
